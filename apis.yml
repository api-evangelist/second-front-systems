name: Second Front Systems
description: >-
  Second Front Systems is a public-benefit, venture-backed software company that
  accelerates government access to emerging technologies for the world's democracies.
  Its 2F Suite delivers DevSecOps and continuous-accreditation tooling for defense
  and public-sector software teams: 2F Workshop (integrated security and compliance
  tooling for accredited development), 2F Game Warden (a fully accredited FedRAMP High
  and DoD ATO DevSecOps platform that fast-tracks commercial software to classified
  and unclassified government networks in roughly 90 days), and 2F Frontier (edge
  deployment to disconnected and denied environments). The company was surfaced as a
  portfolio company of Battery Ventures. It exposes no public developer API; its
  primary technical surface is the Game Warden platform documentation, a compliance
  Trust Center, and a broad certification posture (FedRAMP, SOC 2, ISO 27001, CMMC,
  FIPS 140).
